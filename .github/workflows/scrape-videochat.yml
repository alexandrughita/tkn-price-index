name: Scrape Videochat Pricing

on:
  schedule:
    # Once a month: 1st at 10:00 UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run videochat price scraper
        id: scrape
        run: node scripts/scrape-videochat-prices.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "TKN Price Bot"
          git config user.email "bot@tkn.dev"
          git add data/videochat.json
          git commit -m "chore: update videochat token pricing $(date +%Y-%m-%d)"
          git push
